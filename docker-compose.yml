# Local development stack: `docker compose up -d postgres redis` for services only,
# or `docker compose --profile app up --build` to run API + web + admin in containers.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: collabiz }
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ['6379:6379']
  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/collabiz
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /data/storage
    volumes: [apistorage:/data/storage]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ['4000:4000']
  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/next.Dockerfile, args: { APP: web, PORT: '3000' } }
    environment: { API_INTERNAL_URL: http://api:4000 }
    depends_on: [api]
    ports: ['3000:3000']
  admin:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/next.Dockerfile, args: { APP: admin, PORT: '3001' } }
    environment: { API_INTERNAL_URL: http://api:4000 }
    depends_on: [api]
    ports: ['3001:3001']
volumes:
  pgdata:
  apistorage:
